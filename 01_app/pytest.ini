[pytest]
# Only the live suite; var/backups keeps historical copies of these files.
testpaths = tests
cache_dir = .pytest_cache
# An explicit path argument must not pull in runtime packages or historical copies.
norecursedirs = runtime var data work output design-output cache .venv node_modules docs frontend exports screenshots .playwright-cli fixtures
# Each API fixture seeds an isolated project tree; keep only the most recent run.
tmp_path_retention_count = 1
markers =
    knowledge_pack: 需要经授权的知识包；设置 NERO_DISCLOSURE_KNOWLEDGE_ROOT 后运行
